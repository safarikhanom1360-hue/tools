<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">

<title>اسم نوزاد با معنی | جستجوی اسم دختر و پسر</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3fb;--card:#fff;--ink:#231b3a;--mute:#6c6486;--line:#e2dcf0;--girl:#d6457f;--boy:#2f7fd1;--acc:#6a4fd0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15111f;--card:#1f1930;--ink:#f0ecfa;--mute:#a99fc4;--line:#352d4b;--girl:#ff7aa8;--boy:#6cb2ff;--acc:#a996ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15111f;--card:#1f1930;--ink:#f0ecfa;--mute:#a99fc4;--line:#352d4b;--girl:#ff7aa8;--boy:#6cb2ff;--acc:#a996ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.8}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--bg);padding:12px 16px 10px}
.top div{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:0 14px}
.top div:focus-within{border-color:var(--acc)}
.top input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:inherit;font-size:1.1rem;padding:12px 0}
main{max-width:640px;margin:0 auto;padding:0 16px 40px}
h1{font-size:1.6rem;font-weight:800;margin:8px 0 2px;line-height:1.6}
.sub{margin:0 0 14px;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;padding:6px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}
.chip:focus-visible,.fav:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.cnt{margin:14px 0 8px;font-size:.9rem;color:var(--mute);min-height:1.6em}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.n{background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;gap:8px}
.n b{font-size:1.35rem;font-weight:800;line-height:1.5}
.n small{color:var(--c);font-weight:600;margin-inline-start:8px}
.n p{margin:0;color:var(--mute);font-size:.95rem}
.fav{flex:none;align-self:flex-start;background:none;border:0;font-size:1.5rem;line-height:1;color:var(--girl);cursor:pointer;padding:6px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:30px 0}
.ad{margin:18px 0 0;text-align:center}.ad:empty{display:none}
footer{margin-top:24px;text-align:center;font-size:.8rem;color:var(--mute)}
</style>
</head>

<div class="top"><div><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="جستجوی اسم یا معنی…" autocomplete="off" aria-label="جستجوی اسم"></div></div>

<p class="sub">اسم دختر و پسر، همراه با معنی</p>

  <button class="chip on" data-f="all">همه</button>

  <button class="chip" data-f="پ">پسر</button>

<footer>معنی اسم‌ها بر پایه‌ی منابع رایج آمده و برخی اسم‌ها چند معنی دارند.</footer>

const N=RAW.split('\n').map(l=>{const [n,g,m]=l.split('|');return {n,g,m}}).sort((a,b)=>a.n.localeCompare(b.n,'fa'));
const nz=s=>s.replace(/ي/g,'ی').replace(/ك/g,'ک').replace(/[آأإ]/g,'ا').replace(/[\u200c\s\u064B-\u0652]/g,'');
const $=id=>document.getElementById(id);
let f='all',fav=new Set();
try{fav=new Set(JSON.parse(localStorage.getItem('fav')||'[]'))}catch(_){}

function draw(){
  const q=nz($('q').value);
  const out=N.filter(x=>(f==='all'||(f==='fav'?fav.has(x.n):x.g===f))&&(!q||nz(x.n).includes(q)||nz(x.m).includes(q)));
  $('cnt').textContent=out.length?out.length.toLocaleString('fa-IR')+' اسم':'';
  $('list').innerHTML=out.length?out.map(x=>`<div class="n" style="--c:var(--${x.g==='د'?'girl':'boy'})"><div><b>${x.n}</b><small>${x.g==='د'?'دختر':'پسر'}</small><p>${x.m}</p></div><button class="fav" data-n="${x.n}" aria-label="نشان‌کردن ${x.n}">${fav.has(x.n)?'♥':'♡'}</button></div>`).join(''):`<p class="empty">${f==='fav'&&!q?'هنوز اسمی رو نشان نکردی. روی ♡ کنار هر اسم بزن.':'اسمی پیدا نشد. یه بخش از اسم یا یه کلمه از معنی رو امتحان کن.'}</p>`;
}
$('q').addEventListener('input',draw);
$('chips').onclick=e=>{
  const b=e.target.closest('.chip');if(!b)return;
  f=b.dataset.f;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
  draw();
};
$('list').onclick=e=>{
  const b=e.target.closest('.fav');if(!b)return;
  const n=b.dataset.n;
  fav.has(n)?fav.delete(n):fav.add(n);
  try{localStorage.setItem('fav',JSON.stringify([...fav]))}catch(_){}
  draw();
};
draw();
