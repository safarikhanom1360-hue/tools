<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<script>
!function(e,t,n){e.yektanetAnalyticsObject=n,e[n]=e[n]||function(){e[n].q.push(arguments)},e[n].q=e[n].q||[];var a=t.getElementsByTagName("head")[0],r=new Date,c="https://cdn.yektanet.com/superscript-v2/SrqI7w4C/native-49101/yn_pub.js?v="+r.getFullYear().toString()+"0"+r.getMonth()+"0"+r.getDate()+"0"+r.getHours(),s=t.createElement("link");s.rel="preload",s.as="script",s.href=c,a.appendChild(s);var l=t.createElement("script");l.async=!0,l.src=c,a.appendChild(l);}(window,document,"yektanet");

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تو کدوم غذای ایرانی هستی؟ | تست شخصیت</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--g1:#ffe2bd;--g2:#ffc9cf;--g3:#ffd6ee;--card:rgba(255,255,255,.92);--ink:#3b1f1b;--mute:#7a5a54;--acc:#d6336c;--onacc:#fff;--accbg:#ffe3ee;--line:#f0c4c0;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:#3d1f2b;--g2:#4b2233;--g3:#2c2048;--card:rgba(32,18,30,.92);--ink:#fdeee8;--mute:#d8b9b2;--acc:#ff7aa8;--onacc:#3b0f22;--accbg:#4b2334;--line:#5b3446;color-scheme:dark}}
:root[data-theme="dark"]{--g1:#3d1f2b;--g2:#4b2233;--g3:#2c2048;--card:rgba(32,18,30,.92);--ink:#fdeee8;--mute:#d8b9b2;--acc:#ff7aa8;--onacc:#3b0f22;--accbg:#4b2334;--line:#5b3446;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Vazirmatn",Tahoma,sans-serif;color:var(--ink);line-height:1.8;background:linear-gradient(120deg,var(--g1),var(--g2),var(--g3),var(--g1));background-size:300% 300%;animation:drift 20s ease-in-out infinite}
@keyframes drift{50%{background-position:100% 50%}}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.bg span{position:absolute;bottom:-70px;opacity:.55;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh) rotate(40deg)}}
@media (prefers-reduced-motion:reduce){body{animation:none}.bg{display:none}}
main{position:relative;max-width:520px;margin:0 auto;padding:28px 16px 40px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
.card{background:var(--card);border-radius:22px;padding:24px 20px;box-shadow:0 10px 40px rgba(120,40,60,.18)}
.emoji{font-size:3.4rem;line-height:1.3}
h1{font-size:1.9rem;font-weight:800;margin:6px 0 8px;line-height:1.6}
h2{font-size:1.3rem;font-weight:800;margin:10px 0 14px;line-height:1.7}
p{margin:0 0 14px;color:var(--mute)}
.btn{display:block;width:100%;font:inherit;font-weight:600;font-size:1.05rem;padding:13px 16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);text-align:right;cursor:pointer;margin-top:10px}
.btn:hover,.btn:focus-visible{border-color:var(--acc);outline:none}
.go{background:var(--acc);color:var(--onacc);border-color:var(--acc);text-align:center}
.go.alt{background:none;color:var(--acc)}
.bar{height:8px;background:var(--accbg);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:8px;transition:width .3s}
.cnt{font-size:.85rem;margin:8px 0 0}
.name{font-size:2.2rem;font-weight:800;color:var(--acc);line-height:1.5}
.ad{margin:16px 0 0;text-align:center}.ad:empty{display:none}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<main><div class="card" id="app"></div>
<div class="ad"><!-- 📢 جای تبلیغات: بعد از تأیید در شبکه‌ی تبلیغاتی (مثل یکتانت)، کد تبلیغ رو دقیقاً همین‌جا پیست کن --></div></main>
<script>
const FOODS=['🍲','🍢','🥘','🌿','🍅','🍋','🧅','🍚','🥜'];
const bg=document.getElementById('bg');
for(let i=0;i<18;i++){
  const s=document.createElement('span'),d=16+Math.random()*14;
  s.textContent=FOODS[i%FOODS.length];
  s.style.cssText=`left:${Math.random()*94}%;font-size:${26+Math.random()*30}px;animation-duration:${d}s;animation-delay:-${Math.random()*d}s`;
  bg.appendChild(s);
}
const R=[
{e:'🥘',n:'قورمه‌سبزی',t:'صبور، گرم و قابل اعتمادی. هر کسی دلش بگیره، پیش تو جا داره. شاید دیر دیده بشی، ولی کسی که تو رو شناخت دیگه ولت نمی‌کنه.',m:'رفیق خوبت: کباب کوبیده'},
{e:'🍢',n:'کباب کوبیده',t:'شاد، رک و پر از انرژی. هر جمعی که تو توش باشی یهو جون می‌گیره. تو همونی هستی که برنامه می‌چینه و همه رو دور هم جمع می‌کنه.',m:'رفیق خوبت: قورمه‌سبزی'},
{e:'🍲',n:'آش رشته',t:'آروم، دلسوز و عمیقی. کم‌حرفی، ولی وقتی حرف می‌زنی همه گوش می‌دن. آدم‌ها کنارت آرامش می‌گیرن، حتی وقتی خودت خسته‌ای.',m:'رفیق خوبت: فسنجون'},
{e:'🥜',n:'فسنجون',t:'خاص، خلاق و کمی رمزآلودی. سلیقه‌ات فرق داره و دوست نداری شبیه هیچ‌کس باشی. دوست‌داشتنی‌ای، ولی پیش‌بینی‌شدنی نه.',m:'رفیق خوبت: آش رشته'}
];
const Q=[
['جمعه‌ست و هیچ برنامه‌ای نداری. چیکار می‌کنی؟',[['می‌رم پیش خانواده، سر یه سفره‌ی گرم',0],['بچه‌ها رو جمع می‌کنم بریم بیرون!',1],['با چای و یه فیلم تو خونه می‌مونم',2],['یه جای جدید که تا حالا نرفتم پیدا می‌کنم',3]]],
['دوستات تو رو چطور توصیف می‌کنن؟',[['قابل اعتماد، همیشه هستی',0],['شلوغ‌کن و خوش‌خنده',1],['آروم و خوب گوش‌کن',2],['یه کم مرموز و بامزه',3]]],
['سفر رویایی‌ت کدومه؟',[['شمال، یه ویلای خانوادگی',0],['یه سفر پر از ماجراجویی با رفقا',1],['یه شهر قدیمی مثل یزد یا کاشان',2],['یه کشور دور که کمتر کسی رفته',3]]],
['وقتی یکی ناراحته، تو چیکار می‌کنی؟',[['براش یه چیز خونگی می‌پزم',0],['سرگرمش می‌کنم تا بخنده',1],['گوش می‌دم تا هرچی تو دلشه بگه',2],['یه راه‌حل خلاقانه براش پیدا می‌کنم',3]]],
['ساعت ۱۱ شب دوست داری کجا باشی؟',[['تو رختخواب، با یه خواب راحت',0],['هنوز بیدار و پای حرف با رفقا',1],['تو سکوت، غرق فکر',2],['مشغول یه ایده‌ی جدید',3]]],
['کدوم جمله بیشتر شبیه توئه؟',[['صبر کن، ارزشش رو داره',0],['زندگی کوتاهه، حالش رو ببر',1],['آروم باش، همه‌چی درست می‌شه',2],['متفاوت بودن از معمولی بودن بهتره',3]]]
];
const app=document.getElementById('app'),fa=n=>n.toLocaleString('fa-IR');
let i=0,sc=[0,0,0,0];

function start(){
  i=0;sc=[0,0,0,0];
  app.innerHTML='<div class="emoji">🍲🍢🥘</div><h1>تو کدوم غذای ایرانی هستی؟</h1><p>۶ سؤال سریع تا ببینی شخصیتت به کدوم غذا می‌خوره.</p><button class="btn go" id="s">شروع تست</button>';
  document.getElementById('s').onclick=ask;
}
function ask(){
  if(i>=Q.length)return done();
  const [q,o]=Q[i],opts=[...o].sort(()=>Math.random()-.5);
  app.innerHTML=`<div class="bar"><i style="width:${i/Q.length*100}%"></i></div><p class="cnt">سؤال ${fa(i+1)} از ${fa(Q.length)}</p><h2>${q}</h2>`+opts.map(x=>`<button class="btn" data-k="${x[1]}">${x[0]}</button>`).join('');
  app.querySelectorAll('.btn').forEach(b=>b.onclick=()=>{sc[b.dataset.k]++;i++;ask()});
}
function done(){
  const r=R[sc.indexOf(Math.max(...sc))];
  app.innerHTML=`<div class="emoji">${r.e}</div><p class="cnt">تو شدی</p><div class="name">${r.n}</div><p style="margin-top:8px">${r.t}</p><p><b>${r.m}</b></p><button class="btn go" id="sh">بفرست برای دوستت</button><button class="btn go alt" id="re">دوباره تست بده</button>`;
  document.getElementById('re').onclick=start;
  document.getElementById('sh').onclick=async e=>{
    const t=`من «${r.n}» شدم ${r.e} تو کدوم غذای ایرانی هستی؟`;
    try{if(navigator.share){await navigator.share({title:'تست غذای ایرانی',text:t,url:location.href});return}}catch(err){if(err&&err.name==='AbortError')return}
    try{await navigator.clipboard.writeText(t+' '+location.href);e.target.textContent='کپی شد ✓'}catch(_){e.target.textContent=t}
  };
}
start();
</script>
</body>
</html>
